name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: 'webappaula1234'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login no ACR
        run: az acr login --name caua2803

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker
        run: |
          docker build -t caua2803-e9cea3acd9cce5er.azurecr.io/minha-app:latest .

      - name: Push Docker
        run: |
          docker push caua2803-e9cea3acd9cce5er.azurecr.io/minha-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar imagem no Web App
        run: |
          az webapp config container set \
            --name webappaula1234 \
            --resource-group rg-python-aula \
            --container-image-name caua2803-e9cea3acd9cce5er.azurecr.io/minha-app:latest

      - name: Restart WebApp
        run: |
          az webapp restart \
            --name webappaula1234 \
            --resource-group rg-python-aula
